<h1>Conversor a RGB</h1>

<app-componente-a (enviar)="recibirHex($event)"></app-componente-a>

<div class="fila">
  <div>
    <app-componente-b nombre="R" [valor]="r"></app-componente-b>
    <app-componente-b nombre="G" [valor]="g"></app-componente-b>
    <app-componente-b nombre="B" [valor]="b"></app-componente-b>
  </div>

  <app-componente-c [r]="r" [g]="g" [b]="b"></app-componente-c>
</div>
